services:
  technest-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "80:80"
    depends_on:
      - technest-server
    restart: always

  technest-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "5000:5000"
    env_file:
      - server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
