name: TechNest Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test Applications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & Build Frontend
        run: |
          cd client
          npm install
          npm run build

      - name: Install, Build & Test Backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          cd server
          npm install
          npm run build
          npm test

  docker-build-push:
    name: Build Docker Images & Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: TechNest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Azure Cloud Credentials
        id: azure-check
        run: |
          if [ -n "${{ secrets.ACR_USERNAME }}" ]; then
            echo "has_acr=true" >> $GITHUB_OUTPUT
            echo "✅ ACR Credentials detected."
          else
            echo "has_acr=false" >> $GITHUB_OUTPUT
            echo "⚠️ ACR Secrets are not configured. Skipping Docker image push."
          fi

          if [ -n "${{ secrets.AKS_CLUSTER_NAME }}" ]; then
            echo "has_aks=true" >> $GITHUB_OUTPUT
            echo "✅ AKS Credentials detected."
          else
            echo "has_aks=false" >> $GITHUB_OUTPUT
            echo "⚠️ AKS Secrets are not configured. Skipping Kubernetes deployment."
          fi

      - name: Build Frontend Image (Verification)
        run: |
          docker build -t technest-client:latest -f Dockerfile.client .

      - name: Build Backend Image (Verification)
        run: |
          docker build -t technest-server:latest -f Dockerfile.server .

      - name: Run Trivy vulnerability scanner on Frontend Image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'technest-client:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on Backend Image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'technest-server:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Azure Container Registry (ACR)
        if: steps.azure-check.outputs.has_acr == 'true'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag and Push Frontend Image
        if: steps.azure-check.outputs.has_acr == 'true'
        run: |
          docker tag technest-client:latest ${{ secrets.ACR_LOGIN_SERVER }}/technest-client:${{ github.sha }}
          docker tag technest-client:latest ${{ secrets.ACR_LOGIN_SERVER }}/technest-client:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/technest-client:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/technest-client:latest

      - name: Tag and Push Backend Image
        if: steps.azure-check.outputs.has_acr == 'true'
        run: |
          docker tag technest-server:latest ${{ secrets.ACR_LOGIN_SERVER }}/technest-server:${{ github.sha }}
          docker tag technest-server:latest ${{ secrets.ACR_LOGIN_SERVER }}/technest-server:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/technest-server:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/technest-server:latest

      - name: Set AKS Context & Deploy Manifests
        if: steps.azure-check.outputs.has_aks == 'true' && steps.azure-check.outputs.has_acr == 'true'
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RG }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy Kubernetes Manifests
        if: steps.azure-check.outputs.has_aks == 'true' && steps.azure-check.outputs.has_acr == 'true'
        run: |
          if [ -d "k8s" ]; then
            kubectl apply -f k8s/server-deployment.yaml
            kubectl apply -f k8s/client-deployment.yaml
          else
            echo "k8s directory not found, skipping Kubernetes deployment."
          fi
