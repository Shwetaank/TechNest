services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres.technest:TechNestSecretKey2026@aws-0-ap-south-1.pooler.supabase.com:6543/postgres?pgbouncer=true
      - DIRECT_URL=postgresql://postgres.technest:TechNestSecretKey2026@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      - SUPABASE_URL=https://technest-store.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=sample_key
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=technest_production_jwt_signing_secret_987654321
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
