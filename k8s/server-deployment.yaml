apiVersion: apps/v1
kind: Deployment
metadata:
  name: technest-server
  labels:
    app: technest-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technest-server
  template:
    metadata:
      labels:
        app: technest-server
    spec:
      containers:
        - name: server
          image: technest.azurecr.io/technest-server:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: technest-secrets
                  key: database-url
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: technest-secrets
                  key: resend-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: technest-server-service
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: technest-server
