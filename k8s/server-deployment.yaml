apiVersion: apps/v1
kind: Deployment
metadata:
  name: technest-server
  labels:
    app: technest-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technest-server
  template:
    metadata:
      labels:
        app: technest-server
    spec:
      containers:
        - name: server
          image: technest.azurecr.io/technest-server:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              value: "InstrumentationKey=271c3b1e-b839-45de-b0a4-8c14f96b667a;IngestionEndpoint=https://centralindia-0.in.applicationinsights.azure.com/;LiveEndpoint=https://centralindia.livediagnostics.monitor.azure.com/;ApplicationId=d530bb1b-77f8-4760-b551-73d3709b365f"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: technest-secrets
                  key: database-url
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: technest-secrets
                  key: resend-api-key
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "technest-azure-keyvault"
---
apiVersion: v1
kind: Service
metadata:
  name: technest-server
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: technest-server
