apiVersion: apps/v1
kind: Deployment
metadata:
  name: technest-client
  labels:
    app: technest-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: technest-client
  template:
    metadata:
      labels:
        app: technest-client
    spec:
      containers:
        - name: client
          image: acrtechnestprod.azurecr.io/technest-client:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: technest-client-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: technest-client
